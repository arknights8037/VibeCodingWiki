[project]
name = "vibecodingwiki-backend"
version = "0.1.0"
description = "VibeCodingWiki FastAPI backend"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.140,<1",
  "mcp>=2,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
