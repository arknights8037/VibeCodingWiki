name: vibecodingwiki

services:
  backend:
    build:
      context: ./开发/backend
    environment:
      VCW_ENVIRONMENT: ${VCW_ENVIRONMENT:-production}
      VCW_DATABASE_URL: ${VCW_DATABASE_URL:-sqlite+aiosqlite:////data/vibecodingwiki.db}
      VCW_DATA_DIR: ${VCW_DATA_DIR:-/data}
      VCW_ACCESS_SECRET: ${VCW_ACCESS_SECRET:-local-development-secret-change-me}
      VCW_ACCESS_TOKEN_MINUTES: ${VCW_ACCESS_TOKEN_MINUTES:-30}
      VCW_REFRESH_TOKEN_DAYS: ${VCW_REFRESH_TOKEN_DAYS:-7}
      VCW_COOKIE_SECURE: ${VCW_COOKIE_SECURE:-false}
      VCW_ADMIN_EMAIL: ${VCW_ADMIN_EMAIL:-admin@example.com}
      VCW_ADMIN_PASSWORD: ${VCW_ADMIN_PASSWORD:-ChangeMe123!}
      VCW_ALLOWED_ORIGINS: ${VCW_ALLOWED_ORIGINS:-["http://localhost","http://localhost:8088"]}
      VCW_FRONTEND_URL: ${VCW_FRONTEND_URL:-http://localhost:8088}
    volumes:
      - vibecodingwiki_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./开发/frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${VCW_HTTP_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  vibecodingwiki_data:
